spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  flyway:
    enabled: false  # Disable Flyway for unit tests
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://mock-issuer.com
          jwk-set-uri: https://mock-issuer.com/.well-known/jwks.json

logging:
  level:
    com.memberbenefits: DEBUG
    org.springframework.security: DEBUG
    org.testcontainers: INFO