server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: member-benefits-dashboard
  
  datasource:
    url: jdbc:postgresql://localhost:5432/member_benefits_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate  # Let Flyway handle schema creation
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

# Custom application properties
app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
    audience: ${GOOGLE_AUDIENCE:your-google-client-id}
  
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# Logging
logging:
  level:
    com.memberbenefits: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG