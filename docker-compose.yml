version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: member-benefits-postgres
    environment:
      POSTGRES_DB: member_benefits_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: Mount migration scripts
    networks:
      - member-benefits-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: member-benefits-backend
    environment:
      # Database connection (using postgres service name)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/member_benefits_db
      DB_USERNAME: postgres
      DB_PASSWORD: password
      # Google OIDC - Using existing credentials
      GOOGLE_CLIENT_ID: 1047926570153-jn8dvifgmg9lpjfngfdsm4ierh640tlg.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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
      GOOGLE_AUDIENCE: 1047926570153-jn8dvifgmg9lpjfngfdsm4ierh640tlg.apps.googleusercontent.com
      # CORS
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - member-benefits-network
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: member-benefits-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    networks:
      - member-benefits-network
    depends_on:
      - backend

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local

# Custom network for service communication
networks:
  member-benefits-network:
    driver: bridge