version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: member-benefits-postgres
    environment:
      POSTGRES_DB: member_benefits_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: Mount migration scripts
      - ./backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - member-benefits-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: member-benefits-backend
    environment:
      # Database connection (using postgres service name)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/member_benefits_db
      DB_USERNAME: postgres
      DB_PASSWORD: password
      # Google OIDC (placeholder values)
      GOOGLE_CLIENT_ID: your-google-client-id
      GOOGLE_AUDIENCE: your-google-client-id
      # CORS
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - member-benefits-network
    restart: unless-stopped

  # Frontend (placeholder for future React app)
  frontend:
    image: nginx:alpine
    container_name: member-benefits-frontend
    ports:
      - "3000:80"
    volumes:
      # This will be used when we build the React frontend
      - ./frontend/build:/usr/share/nginx/html:ro
    networks:
      - member-benefits-network
    depends_on:
      - backend

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local

# Custom network for service communication
networks:
  member-benefits-network:
    driver: bridge